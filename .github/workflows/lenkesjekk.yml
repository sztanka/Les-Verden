# Les verden – «Lenkesjekk»
# Sjekker alle lenker til andre nettsteder den 1. i hver måned (og når du kjører den manuelt).
# Finner den døde lenker, opprettes en sak (issue) i repoet med en liste.
name: Lenkesjekk
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"
permissions:
  contents: read
  issues: write
jobs:
  lenker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sjekk lenker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --timeout 30 --max-retries 2
            --accept 200,201,204,206,301,302,303,307,308,403,429
            --exclude-path data/ordbok --exclude "images.unsplash.com" --exclude "youtube-nocookie.com"
            "./**/*.html" "./data/**/*.js" "./assets/**/*.js"
          output: lenkesjekk.md
          fail: false
      - name: Opprett sak hvis noe er galt
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Døde lenker funnet (lenkesjekk)
          content-filepath: lenkesjekk.md
          labels: lenkesjekk
