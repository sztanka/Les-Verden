<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Begrepsbank – Les verden</title>
  <meta name="description" content="Alle begrepene fra temaene i samfunnsfag og engelsk, samlet på ett sted.">
  <link rel="stylesheet" href="assets/stil.css?v=20261030b">
  <script src="data/innstillinger.js?v=20261030b"></script>
  <script src="data/temaer/oversikt.js?v=20261030b"></script>
  <script src="assets/felles.js?v=20261030b"></script>
  <script src="assets/samle.js?v=20261030b"></script>
  <script src="assets/begreper.js?v=20261030b"></script>
</head>
<body data-side="begreper">
  <main id="innhold">
    <header class="sidehode">
      <h1>Begrepsbank</h1>
      <p class="ingress">Alle ordene og begrepene som forklares i temaene, samlet på ett sted. Engelske ord har norsk oversettelse. Trykk på et tema for å se begrepet brukt i teksten.</p>
    </header>

    <div class="verktoy" role="search">
      <label class="sok">
        <span class="etikett">Søk</span>
        <input type="search" id="sok" placeholder="Søk etter et ord eller en forklaring" autocomplete="off">
      </label>
      <div class="filter" role="group" aria-label="Velg fag">
        <span class="etikett">Fag:</span>
        <button class="knapp" data-fag="">Begge</button>
        <button class="knapp" data-fag="samfunnsfag">Samfunnsfag</button>
        <button class="knapp" data-fag="engelsk">Engelsk</button>
      </div>
      <div class="filter" role="group" aria-label="Velg trinn">
        <span class="etikett">Trinn:</span>
        <button class="knapp" data-trinn="">Alle</button>
        <button class="knapp" data-trinn="8">8.</button>
        <button class="knapp" data-trinn="9">9.</button>
        <button class="knapp" data-trinn="10">10.</button>
      </div>
    </div>

    <nav class="bokstaver" id="bokstaver" aria-label="Hopp til bokstav"></nav>
    <p class="antall" id="antall" aria-live="polite">Henter temaene …</p>
    <div id="begreper"></div>
  </main>
</body>
</html>
