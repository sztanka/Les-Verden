<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">Tegning av London om kvelden med klokketårn, hustak og en gatelykt</title>
  <defs>
    <linearGradient id="kveld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4f"/>
      <stop offset=".6" stop-color="#3a4f86"/>
      <stop offset="1" stop-color="#8f86a8"/>
    </linearGradient>
    <radialGradient id="glod" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#kveld)"/>
  <!-- Stjerner og måne -->
  <g fill="#fff" opacity=".8"><circle cx="60" cy="40" r="1.6"/><circle cx="140" cy="70" r="1.2"/><circle cx="230" cy="30" r="1.5"/><circle cx="330" cy="60" r="1.1"/><circle cx="420" cy="28" r="1.4"/><circle cx="560" cy="80" r="1.2"/><circle cx="600" cy="36" r="1.6"/></g>
  <circle cx="520" cy="70" r="26" fill="#f3ead2"/>
  <circle cx="530" cy="64" r="24" fill="#2a3a66"/>
  <!-- Klokketårn -->
  <g fill="#121b33">
    <rect x="300" y="110" width="44" height="200"/>
    <rect x="294" y="104" width="56" height="12"/>
    <path d="M296 104 L322 52 L348 104Z"/>
    <rect x="320" y="34" width="4" height="22"/>
  </g>
  <circle cx="322" cy="140" r="15" fill="#f6e3a6"/>
  <g stroke="#121b33" stroke-width="2.5" stroke-linecap="round"><line x1="322" y1="140" x2="322" y2="130"/><line x1="322" y1="140" x2="330" y2="143"/></g>
  <!-- Hustak med piper -->
  <path d="M0 360 V250 H40 V230 H52 V250 H90 L120 222 L150 250 H190 V236 H200 V250 H240 V262 H290 V360Z" fill="#18223f"/>
  <path d="M350 360 V258 H380 V238 H392 V258 H420 L450 228 L480 258 H520 V242 H530 V258 H560 V246 H572 V258 H640 V360Z" fill="#18223f"/>
  <g fill="#f4c56a" opacity=".9">
    <rect x="22" y="282" width="12" height="16" rx="1"/><rect x="66" y="270" width="12" height="16" rx="1"/><rect x="132" y="282" width="12" height="16" rx="1"/><rect x="210" y="276" width="12" height="16" rx="1"/>
    <rect x="400" y="282" width="12" height="16" rx="1"/><rect x="458" y="272" width="12" height="16" rx="1"/><rect x="540" y="284" width="12" height="16" rx="1"/><rect x="600" y="276" width="12" height="16" rx="1"/>
  </g>
  <!-- Gate -->
  <rect y="318" width="640" height="42" fill="#2a2f45"/>
  <g fill="#3a405a"><rect x="0" y="330" width="640" height="2"/><rect x="0" y="344" width="640" height="2"/></g>
  <!-- Gatelykt -->
  <circle cx="190" cy="186" r="70" fill="url(#glod)"/>
  <g fill="#0e1528">
    <rect x="186" y="196" width="8" height="124"/>
    <rect x="178" y="314" width="24" height="8" rx="2"/>
    <path d="M174 170 H206 L200 200 H180Z"/>
    <path d="M172 170 L190 156 L208 170Z"/>
  </g>
  <path d="M180 174 H200 L196 196 H184Z" fill="#ffd98a"/>
  <!-- Bok i forgrunnen -->
  <g transform="translate(440 300)">
    <path d="M0 22 C30 10 60 10 90 22 C120 10 150 10 180 22 V54 C150 42 120 42 90 54 C60 42 30 42 0 54Z" fill="#f3ead2"/>
    <path d="M90 22 V54" stroke="#b9ad8c" stroke-width="2"/>
    <g stroke="#b9ad8c" stroke-width="1.5"><line x1="16" y1="28" x2="76" y2="24"/><line x1="16" y1="36" x2="76" y2="32"/><line x1="104" y1="24" x2="164" y2="28"/><line x1="104" y1="32" x2="164" y2="36"/></g>
  </g>
</svg>
