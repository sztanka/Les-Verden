<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">Tegning av tre tegneserieruter: en snakkeboble med «Who am I?», et speil og en gruppe ulike ansikter</title>
  <rect width="640" height="360" fill="#f3d36b"/>
  <!-- Prikkraster i bakgrunnen, som i en tegneserie -->
  <defs>
    <pattern id="prikker" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#e6b93f"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#prikker)"/>

  <!-- Rute 1: snakkeboble -->
  <g transform="rotate(-2 120 180)">
    <rect x="28" y="40" width="184" height="280" fill="#fffaf0" stroke="#1f2a44" stroke-width="5"/>
    <path d="M58 92 h124 a18 18 0 0 1 18 18 v54 a18 18 0 0 1 -18 18 h-66 l-26 26 v-26 h-32 a18 18 0 0 1 -18 -18 v-54 a18 18 0 0 1 18 -18z" fill="#fff" stroke="#1f2a44" stroke-width="4"/>
    <text x="120" y="146" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Trebuchet MS, sans-serif" font-weight="700" font-size="26" fill="#1f2a44">Who am I?</text>
    <circle cx="96" cy="262" r="30" fill="#c98a5a"/>
    <path d="M66 262 a30 30 0 0 1 60 0 q-14 -18 -30 -18 q-16 0 -30 18z" fill="#1f2a44"/>
    <rect x="70" y="292" width="52" height="28" rx="12" fill="#2c4f8f"/>
  </g>

  <!-- Rute 2: speil -->
  <g transform="rotate(1.5 320 180)">
    <rect x="228" y="30" width="184" height="300" fill="#fffaf0" stroke="#1f2a44" stroke-width="5"/>
    <ellipse cx="320" cy="160" rx="62" ry="86" fill="#cfe0f2" stroke="#8a6b3a" stroke-width="10"/>
    <path d="M286 110 l26 -20 M298 132 l40 -30" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
    <circle cx="320" cy="168" r="26" fill="#e3b48a" opacity=".85"/>
    <rect x="296" y="196" width="48" height="34" rx="12" fill="#c8561a" opacity=".85"/>
    <rect x="312" y="246" width="16" height="44" fill="#8a6b3a"/>
    <rect x="286" y="286" width="68" height="12" rx="4" fill="#8a6b3a"/>
  </g>

  <!-- Rute 3: mange ansikter -->
  <g transform="rotate(-1.5 520 180)">
    <rect x="428" y="44" width="184" height="276" fill="#fffaf0" stroke="#1f2a44" stroke-width="5"/>
    <g>
      <circle cx="476" cy="128" r="24" fill="#8d5a3b"/><path d="M452 124 a24 24 0 0 1 48 0 q-24 -14 -48 0z" fill="#1f2a44"/>
      <circle cx="560" cy="122" r="24" fill="#f1c9a5"/><path d="M536 120 a24 24 0 0 1 48 0 l0 22 q-6 -16 -24 -22 q-18 6 -24 22z" fill="#c8561a"/>
      <circle cx="518" cy="200" r="24" fill="#d9a477"/><path d="M494 196 a24 24 0 0 1 48 0 q-24 -10 -48 0z" fill="#3a2a1c"/>
      <circle cx="466" cy="272" r="22" fill="#f6dcc2"/><path d="M444 268 a22 22 0 0 1 44 0 q-22 -12 -44 0z" fill="#e3c25a"/>
      <circle cx="570" cy="268" r="22" fill="#6b4430"/><path d="M548 262 a22 22 0 0 1 44 0 q-8 -8 -22 -8 q-14 0 -22 8z" fill="#111"/>
    </g>
  </g>
</svg>
